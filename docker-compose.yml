networks:
  fuel-net:
    driver: bridge

volumes:
  pg_data:
  rabbitmq_data:

services:
  # ── Infrastructure ──────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: fuel_postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-fuelapp}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-fuelapp_secret}
      POSTGRES_DB: postgres
    volumes:
      - pg_data:/var/lib/postgresql/data
      - ./postgres/init:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-fuelapp}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks: [fuel-net]

  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    container_name: fuel_rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: ${POSTGRES_USER:-fuelapp}
      RABBITMQ_DEFAULT_PASS: ${POSTGRES_PASSWORD:-fuelapp_secret}
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 30s
    networks: [fuel-net]
    ports:
      - "15672:15672"  # Management UI (dev convenience)

  # ── Services ────────────────────────────────────────
  auth-service:
    build:
      context: ./services/auth-service
      dockerfile: Dockerfile
    container_name: fuel_auth
    environment:
      PORT: 3001
      DATABASE_URL: postgresql://${POSTGRES_USER:-fuelapp}:${POSTGRES_PASSWORD:-fuelapp_secret}@postgres:5432/auth_db
      JWT_SECRET: ${AUTH_JWT_SECRET:-change_me_in_production}
      JWT_EXPIRES_IN: ${AUTH_JWT_EXPIRES_IN:-8h}
      NODE_ENV: production
    depends_on:
      postgres:
        condition: service_healthy
    networks: [fuel-net]

  station-service:
    build:
      context: ./services/station-service
      dockerfile: Dockerfile
    container_name: fuel_station
    environment:
      PORT: 3002
      DATABASE_URL: postgresql://${POSTGRES_USER:-fuelapp}:${POSTGRES_PASSWORD:-fuelapp_secret}@postgres:5432/station_db
      RABBITMQ_URL: amqp://${POSTGRES_USER:-fuelapp}:${POSTGRES_PASSWORD:-fuelapp_secret}@rabbitmq:5672
      NODE_ENV: production
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks: [fuel-net]

  fuel-service:
    build:
      context: ./services/fuel-service
      dockerfile: Dockerfile
    container_name: fuel_fuel
    environment:
      PORT: 3003
      DATABASE_URL: postgresql://${POSTGRES_USER:-fuelapp}:${POSTGRES_PASSWORD:-fuelapp_secret}@postgres:5432/fuel_db
      RABBITMQ_URL: amqp://${POSTGRES_USER:-fuelapp}:${POSTGRES_PASSWORD:-fuelapp_secret}@rabbitmq:5672
      STATION_SERVICE_URL: http://station-service:3002
      NODE_ENV: production
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      station-service:
        condition: service_started
    networks: [fuel-net]

  import-export-service:
    build:
      context: ./services/import-export-service
      dockerfile: Dockerfile
    container_name: fuel_import
    environment:
      PORT: 3004
      DATABASE_URL: postgresql://${POSTGRES_USER:-fuelapp}:${POSTGRES_PASSWORD:-fuelapp_secret}@postgres:5432/import_db
      RABBITMQ_URL: amqp://${POSTGRES_USER:-fuelapp}:${POSTGRES_PASSWORD:-fuelapp_secret}@rabbitmq:5672
      STATION_SERVICE_URL: http://station-service:3002
      FUEL_SERVICE_URL: http://fuel-service:3003
      MAX_FILE_SIZE_MB: ${IMPORT_MAX_FILE_SIZE_MB:-10}
      NODE_ENV: production
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      station-service:
        condition: service_started
      fuel-service:
        condition: service_started
    networks: [fuel-net]

  realtime-service:
    build:
      context: ./services/realtime-service
      dockerfile: Dockerfile
    container_name: fuel_realtime
    environment:
      PORT: 3005
      RABBITMQ_URL: amqp://${POSTGRES_USER:-fuelapp}:${POSTGRES_PASSWORD:-fuelapp_secret}@rabbitmq:5672
      JWT_SECRET: ${AUTH_JWT_SECRET:-change_me_in_production}
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:5173,http://localhost:5174}
      NODE_ENV: production
    ports:
      - "3005:3005"
    depends_on:
      rabbitmq:
        condition: service_healthy
    networks: [fuel-net]

  gateway:
    build:
      context: ./services/gateway
      dockerfile: Dockerfile
    container_name: fuel_gateway
    ports:
      - "3000:3000"
    environment:
      PORT: 3000
      AUTH_SERVICE_URL: http://auth-service:3001
      STATION_SERVICE_URL: http://station-service:3002
      FUEL_SERVICE_URL: http://fuel-service:3003
      IMPORT_EXPORT_SERVICE_URL: http://import-export-service:3004
      REALTIME_SERVICE_URL: http://realtime-service:3005
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:5173,http://localhost:5174}
      NODE_ENV: production
    depends_on:
      - auth-service
      - station-service
      - fuel-service
      - import-export-service
      - realtime-service
    networks: [fuel-net]
